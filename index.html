<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;overflow:hidden}
h1{position:relative;margin:0;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:clamp(160px,32vmin,360px);font-weight:900;line-height:1;letter-spacing:0}
.halo{position:absolute;left:50%;top:.025em;transform:translate(-50%,-100%);width:.7em;height:.18em;border:.015em solid #d9b44a;border-radius:50%;box-shadow:0 0 .025em #ffd86b,0 0 .07em #f4cf62,inset 0 0 .035em #f4cf62;animation:flicker 4.7s linear infinite;pointer-events:none}
@keyframes flicker{
0%,18%,22%,25%,53%,57%,100%{opacity:1}
19%,24%,54%{opacity:.3}
20%,55%{opacity:.8}
21%,56%{opacity:.45}
70%{opacity:.85}
}
@media(prefers-reduced-motion:reduce){.halo{animation:none}}
</style>
</head>
<body><main aria-label="H with a halo"><h1>H<span class="halo" aria-hidden="true"></span></h1></main></body>
