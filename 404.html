<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6 Poems | Charles M. Daniel</title>
  <meta name="description" content="Listen to 6 Poems by Charles M. Daniel.">
  <link rel="canonical" href="https://charlesmdaniel.com/">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: clamp(1rem, 4vw, 3rem);
      background: #000;
    }

    .cover-link {
      display: block;
      width: min(88vw, 82vh, 720px);
      width: min(88vw, 82svh, 720px);
      aspect-ratio: 1;
      line-height: 0;
      outline-offset: 8px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 180ms ease, filter 180ms ease;
    }

    .cover-link:hover {
      transform: scale(1.015);
      filter: brightness(1.06);
    }

    .cover-link:focus-visible {
      outline: 3px solid #fff;
    }

    .cover-art {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (prefers-reduced-motion: reduce) {
      .cover-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <a class="cover-link" href="https://cmdaniel.bandcamp.com/album/6-poems" aria-label="Listen to 6 Poems on Bandcamp">
    <img class="cover-art" src="/6-poems-cover-art.jpg" alt="6 Poems album artwork by Charles M. Daniel" width="1400" height="1400">
  </a>
</body>
</html>
